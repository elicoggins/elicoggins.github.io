<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 400;
        src: url('file:///Users/elijahcoggins/Documents/Code/personal/public/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 500;
        src: url('file:///Users/elijahcoggins/Documents/Code/personal/public/fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
      }

      /* The game's palette (src/theme.rs, "EMBER"), not the site's paper one.
         This card is usually the very first thing anyone sees of the game —
         in a Discord unfurl or a Slack preview — so it shows the game. */
      :root {
        --bg: #0a0a0c;
        --ink: #e8ecf4;
        --dim: #9aa2ae;
        --amber: #fdb840;
        --cyan: #7fd3f7;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: var(--bg);
        color: var(--ink);
        font-family: 'IBM Plex Mono', monospace;
        -webkit-font-smoothing: antialiased;
      }

      /* A real frame of play, zoomed past the side columns onto the highway
         itself: this image is usually seen as a thumbnail, and the gems are
         the part that has to survive being shrunk. Held near full brightness —
         the scrims below buy the contrast the type needs, so the game does not
         have to be dimmed to pay for it. */
      .shot {
        position: absolute;
        inset: 0;
        background-image: url('file:///Users/elijahcoggins/Documents/Code/personal/public/keyboardwarrior/gameplay.jpg');
        background-size: 118% auto;
        background-position: 45% 100%;
        filter: brightness(0.96) saturate(1.08);
      }

      .scrim {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(10, 10, 12, 0.97) 0%, rgba(10, 10, 12, 0.9) 16%, rgba(10, 10, 12, 0.35) 27%, rgba(10, 10, 12, 0) 37%),
          linear-gradient(0deg, rgba(10, 10, 12, 0.95) 0%, rgba(10, 10, 12, 0.62) 10%, rgba(10, 10, 12, 0) 24%),
          radial-gradient(ellipse 78% 72% at 50% 52%, transparent 45%, rgba(10, 10, 12, 0.5) 100%);
      }

      .card {
        position: relative;
        height: 100%;
        padding: 58px 66px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* Traced from ProggyClean at the same 8-pixel cap height the game's own
         font atlas is baked at, so the name here is set in the game's type. */
      .mark {
        display: block;
        width: 604px;
        fill: var(--ink);
      }

      .tag {
        margin-top: 26px;
        font-size: 25px;
        letter-spacing: 0.06em;
        color: var(--cyan);
      }

      .rule {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--dim);
      }

      .rule .url { text-transform: none; letter-spacing: 0.08em; }
      .rule .free { color: var(--amber); }
    </style>
  </head>
