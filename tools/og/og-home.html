<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Newsreader';
        font-weight: 300;
        src: url('file:///Users/elijahcoggins/Documents/Code/personal/public/fonts/newsreader-latin-300-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 400;
        src: url('file:///Users/elijahcoggins/Documents/Code/personal/public/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 500;
        src: url('file:///Users/elijahcoggins/Documents/Code/personal/public/fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
      }

      :root {
        --paper: #f6f1e6;
        --ink: #181817;
        --muted: #6d6961;
        --hairline: rgba(24, 24, 23, 0.36);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(circle at 23% 18%, rgba(255, 255, 255, 0.54), transparent 28%),
          radial-gradient(circle at 78% 81%, rgba(132, 119, 91, 0.12), transparent 29%),
          linear-gradient(115deg, rgba(255, 255, 255, 0.16), transparent 42%),
          var(--paper);
        color: var(--ink);
        font-family: 'IBM Plex Mono', monospace;
        -webkit-font-smoothing: antialiased;
      }

      .grid {
        position: absolute;
        inset: 0;
        opacity: 0.23;
        background-image:
          linear-gradient(rgba(24, 24, 23, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(24, 24, 23, 0.025) 1px, transparent 1px);
        background-size: 42px 42px, 42px 42px;
        -webkit-mask-image: radial-gradient(circle at center, black, transparent 72%);
      }

      .card {
        position: relative;
        height: 100%;
        padding: 62px 72px;
        display: flex;
        flex-direction: column;
      }

      .rule {
        display: flex;
        justify-content: space-between;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .rule--top { border-bottom: 1px solid var(--hairline); padding-bottom: 22px; }
      .rule--bottom { border-top: 1px solid var(--hairline); padding-top: 22px; }

      .body {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      h1 {
        font-family: 'Newsreader', Georgia, serif;
        font-weight: 300;
        font-size: 118px;
        letter-spacing: 0.01em;
        line-height: 1;
      }

      .role {
        margin-top: 26px;
        font-size: 27px;
        letter-spacing: 0.05em;
        color: var(--muted);
      }

      .url { text-transform: none; letter-spacing: 0.1em; }

      /* Registration ticks, echoing the site's micro-marks. */
      .tick { position: absolute; background: var(--hairline); }
      .tick--tl-h { top: 34px; left: 34px; width: 22px; height: 1px; }
      .tick--tl-v { top: 34px; left: 34px; width: 1px; height: 22px; }
      .tick--br-h { bottom: 34px; right: 34px; width: 22px; height: 1px; }
      .tick--br-v { bottom: 34px; right: 34px; width: 1px; height: 22px; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="card">
      <div class="tick tick--tl-h"></div>
      <div class="tick tick--tl-v"></div>
      <div class="tick tick--br-h"></div>
      <div class="tick tick--br-v"></div>

      <div class="rule rule--top">
        <span>File // EC-1996</span>
        <span>Personal Index</span>
      </div>

      <div class="body">
        <h1>Elijah Coggins</h1>
        <p class="role">Software Engineer</p>
      </div>

      <div class="rule rule--bottom">
        <span class="url">elicoggins.github.io</span>
        <span>Revision 01</span>
      </div>
    </div>
  </body>
</html>
